[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sigaa-scraper"
dynamic = ["version"]
description = "Biblioteca de scraping do SIGAA UFG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lucas Vinícius de L. Assis", email = "lvlassis.2@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "parsel>=1.9.0",
]

[project.scripts]
sigaa-scraper = "sigaa_scraper.__main__:main"

[project.urls]
Repository = "https://github.com/lvlassis/sigaa-scraper"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
